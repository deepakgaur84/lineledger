name: reapply-fork-patches

# Runs automatically on every push to main — including a "Sync fork" merge,
# which is just a fast-forward push as far as GitHub Actions can tell (there's
# no separate "sync" event to hook). Also keeps workflow_dispatch so it can
# still be run by hand if ever needed.
#
# Guard: this job's own commit is itself a push to main, which would
# otherwise trigger this same workflow again, forever. Skipping whenever the
# triggering actor is github-actions[bot] breaks that loop — our own commits
# never re-trigger a second run.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Two rapid pushes to main previously triggered two overlapping runs of this
# workflow, which raced each other's checkout/copy/commit/push sequence and
# corrupted a file (one run committed mid-write from the other). This queues
# runs on the same ref sequentially instead of letting them overlap —
# cancel-in-progress: false means a newer push waits for the current run to
# finish rather than killing it mid-commit, which would risk the same kind
# of corruption a different way.
concurrency:
  group: reapply-fork-patches-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  reapply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect whether this push also touched a patched file
        id: collisions
        # Computed up front (not just as a closing warning) because it now
        # decides HOW the copy step below handles each file: a plain
        # overwrite for anything untouched by this push, a real 3-way merge
        # attempt for anything this push also changed. workflow_dispatch has
        # no before/after commit range to diff, so there's nothing to detect
        # on a manual run — falls through to a plain copy for everything.
        run: |
          set -euo pipefail
          : > /tmp/collided-files.txt

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Not a push event — nothing to diff, every file gets a plain copy."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.event.after }}"

          # A new branch's first push has an all-zero "before" SHA.
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "No prior commit to compare against — skipping."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_by_push="$(git diff --name-only "$before" "$after")"

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            dest="${f#.fork-patches/}"
            if printf '%s\n' "$changed_by_push" | grep -qxF "$dest"; then
              echo "$dest" >> /tmp/collided-files.txt
            fi
          done < <(find .fork-patches -type f)

          count=$(wc -l < /tmp/collided-files.txt)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "This push also touched $count file(s) we've patched:"
            cat /tmp/collided-files.txt
          else
            echo "No overlap between this push and our patched files."
          fi

      - name: Create a backup branch before attempting any merge
        # Only when there's actually a collision to merge through — most
        # runs are a plain, risk-free copy and don't need one. Named to
        # match the *backup*/*Backup* branch-protection ruleset (blocks
        # deletion and force-push) so this is a genuinely safe fallback:
        # if an auto-merge below produces something broken, this branch is
        # an exact, protected snapshot of main right before this run
        # touched anything, to reset back to.
        if: steps.collisions.outputs.count != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="Backup-$(date +%d.%m.%Y)"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
            # Already one for today (an earlier collision run) — suffix
            # with this run's id so today's second rollback point doesn't
            # overwrite the first one.
            branch="${branch}-${{ github.run_id }}"
          fi

          git branch "$branch" HEAD
          git push origin "$branch"
          echo "Backup branch created: $branch"

      - name: Copy patch files over their real paths, merging where this push also changed one
        run: |
          set -euo pipefail
          if [ ! -d .fork-patches ]; then
            echo "No .fork-patches directory found — nothing to reapply."
            exit 0
          fi

          : > /tmp/needs-manual-review.txt

          find .fork-patches -type f | while read -r src; do
            dest="${src#.fork-patches/}"
            mkdir -p "$(dirname "$dest")"

            if ! grep -qxF "$dest" /tmp/collided-files.txt 2>/dev/null; then
              # The common case: nothing about this file changed on the
              # upstream/incoming side of this push, so our copy is simply
              # correct as-is.
              cp "$src" "$dest"
              echo "Reapplied: $dest"
              continue
            fi

            echo "Attempting 3-way merge for $dest (this push also changed it)..."

            # Base = what the real file looked like at the exact commit
            # where we last updated OUR .fork-patches copy — main's history
            # here is fast-forward-only (never rebased/force-pushed), so
            # that commit is always a direct ancestor of HEAD, and at the
            # moment it was made the real path hadn't been touched yet (our
            # own commits only ever change .fork-patches directly; reapply
            # handles the real path separately, afterwards). That makes it
            # exactly "upstream's content right before we most recently
            # customized this file" — the correct base for a 3-way merge
            # against "upstream's content now" (theirs) and "our current
            # customization" (ours).
            last_patch_commit="$(git log -1 --format=%H -- "$src" 2>/dev/null || true)"

            if [ -z "$last_patch_commit" ] \
              || ! git show "$last_patch_commit:$dest" > /tmp/merge-base.txt 2>/dev/null \
              || ! git show "HEAD:$dest" > /tmp/merge-theirs.txt 2>/dev/null; then
              # No prior patch commit to anchor a base on, the file didn't
              # exist yet at that point, or it's been deleted by the
              # incoming change — nothing meaningful to 3-way merge
              # against. Safe fallback: keep our version, flag for a human
              # to look at rather than guess.
              cp "$src" "$dest"
              echo "$dest" >> /tmp/needs-manual-review.txt
              echo "  No usable merge base for $dest — kept our version, flagged for review."
              continue
            fi

            cp "$src" /tmp/merge-ours.txt

            if git merge-file -p /tmp/merge-ours.txt /tmp/merge-base.txt /tmp/merge-theirs.txt > /tmp/merge-result.txt 2>/tmp/merge-stderr.txt; then
              # Clean merge — our change and the incoming one touched
              # different parts of the file. Adopt the combined result as
              # both the real file and the new .fork-patches copy, so
              # future runs reapply the merged version, not the pre-merge
              # one — otherwise the next sync would just re-collide with
              # the same already-resolved change.
              cp /tmp/merge-result.txt "$dest"
              cp /tmp/merge-result.txt "$src"
              echo "  Merged cleanly — upstream's change and ours both kept, .fork-patches updated to match."
            else
              # Genuine textual overlap git can't reconcile on its own.
              # Safe fallback: our version wins outright (identical to
              # this workflow's behaviour before merging existed), and
              # this file is called out for manual review below rather
              # than silently discarding whichever side lost.
              cp "$src" "$dest"
              echo "$dest" >> /tmp/needs-manual-review.txt
              echo "  Real conflict — kept our version, flagged for review."
            fi
          done

      - name: Commit and push if anything changed
        id: commit_and_push
        # Retries on a rejected push: this workflow's own concurrency guard
        # only serializes overlapping runs of ITSELF — it can't stop a
        # direct human commit (or anything else) landing on main in the
        # narrow window between this job's checkout and its own push. That
        # produces a normal, expected "fetch first" rejection, not a real
        # conflict — our change and theirs are almost always to different
        # files. Rebase onto whatever's new and try again, a few times,
        # before actually giving up.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `git diff --quiet` (no args) only compares already-tracked
          # files — it is blind to a brand-new file the copy step just
          # placed at a path that's never been committed before. Staging
          # everything first and diffing the INDEX against HEAD catches
          # both modifications and additions. This was a real, confirmed
          # bug: every genuinely new file introduced via .fork-patches
          # silently never got committed here, even though the copy step
          # above placed it correctly — only updates to already-existing
          # files ever worked.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — sync didn't touch any patched file, or patches already applied."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -s /tmp/needs-manual-review.txt ]; then
            commit_msg="Reapply fork patches after upstream sync (some files need manual review)"
          else
            commit_msg="Reapply fork patches after upstream sync"
          fi
          git commit -m "$commit_msg"

          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5) — something else pushed to main first. Rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep 2
          done

          echo "::error::Failed to push after 5 attempts — main is moving too fast for this job to keep up, or there's a genuine conflict this rebase couldn't resolve. Manual push needed."
          exit 1

      - name: Trigger the docker build for this commit
        # GitHub does not fire other workflows' `on: push` for a commit
        # pushed using the default GITHUB_TOKEN (a deliberate anti-loop
        # safeguard) — meaning docker.yml silently never built any of this
        # workflow's own commits. That's a real, confirmed gap: every fix
        # that only reached main via this bot's commit (rather than a
        # direct human push) never got its own image build, and :edge
        # stayed on whatever a later, unrelated human commit happened to
        # build next. A workflow_dispatch triggered via the API isn't
        # subject to that restriction, so trigger it explicitly here.
        if: steps.commit_and_push.outputs.pushed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/docker.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Fail loudly if any file needed manual review
        # Runs after the commit/push/trigger above already went through —
        # the app is already deployed and working either way (every
        # conflicted file kept our own version as a safe fallback). This
        # step's only job is to make the run show red so a failure
        # notification fires; a plain ::warning:: annotation does not
        # trigger GitHub's failure-notification email, only a genuinely
        # failed run does.
        run: |
          set -euo pipefail
          if [ ! -s /tmp/needs-manual-review.txt ]; then
            echo "Nothing needed manual review — any collisions this run found merged cleanly."
            exit 0
          fi

          echo "::error::This push touched a file we've patched, and it couldn't be merged automatically — the change genuinely overlaps ours. Our version was kept (the app is fine), but a real upstream improvement may have been discarded. Diff upstream's current version of each file below against .fork-patches before assuming nothing was lost. A backup branch from right before this run was also created, matching the Backup-DD.MM.YYYY pattern, if anything here needs rolling back instead:"
          sed 's/^/::error::  - /' /tmp/needs-manual-review.txt
          exit 1

name: reapply-fork-patches

# Keeps main = upstream + our patches, and keeps it that way without anyone clicking
# "Sync fork". Every run, in this order:
#
#   1. Checks whether a MERGE is about to happen: upstream has commits we lack, or the
#      triggering push also changed a file we patch (which step 4 has to 3-way merge).
#   2. If one is — and only then — backs main up to a Backup-DD.MM.YYYY branch BEFORE it
#      merges. A run that merges nothing (a plain patch upload, or the daily check finding
#      nothing new) makes no backup. Nothing is ever merged without one.
#   3. Syncs with upstream. If we're behind, upstream is merged in HERE rather than by the
#      "Sync fork" button, because that button refuses outright ("This branch has conflicts
#      that must be resolved") the moment upstream edits a line of a file we also patch —
#      and it can't be told to resolve anything. This step can: see its comments for the
#      per-file policy.
#   4. Copies .fork-patches over their real paths (3-way merging any file the triggering
#      push also changed), commits, pushes, and kicks off the docker build and the tests.
#
# Triggers: every push to main (a human upload, or a "Sync fork" that did work); a daily
# check so upstream fixes arrive on their own; and a manual run. The job's own commits are
# pushes to main too, which would trigger this workflow again, forever — skipping whenever
# the triggering actor is github-actions[bot] breaks that loop.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily (mid-afternoon in NZ)
  workflow_dispatch: {}

env:
  UPSTREAM_REPO: lineledger/lineledger
  UPSTREAM_BRANCH: main

# Two rapid pushes to main previously triggered two overlapping runs of this
# workflow, which raced each other's checkout/copy/commit/push sequence and
# corrupted a file (one run committed mid-write from the other). This queues
# runs on the same ref sequentially instead of letting them overlap —
# cancel-in-progress: false means a newer push waits for the current run to
# finish rather than killing it mid-commit, which would risk the same kind
# of corruption a different way.
concurrency:
  group: reapply-fork-patches-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  reapply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare
        # Git identity for the commits below, and the scratch files the later steps share —
        # created here, once, so no step can wipe notes an earlier one made.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          : > /tmp/needs-manual-review.txt
          : > /tmp/sync-actions.tsv

      - name: Detect whether this push also touched a patched file
        id: collisions
        # Computed up front (not just as a closing warning) because it now
        # decides HOW the copy step below handles each file: a plain
        # overwrite for anything untouched by this push, a real 3-way merge
        # attempt for anything this push also changed. workflow_dispatch has
        # no before/after commit range to diff, so there's nothing to detect
        # on a manual run — falls through to a plain copy for everything.
        run: |
          set -euo pipefail
          : > /tmp/collided-files.txt

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Not a push event — nothing to diff, every file gets a plain copy."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.event.after }}"

          # A new branch's first push has an all-zero "before" SHA.
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "No prior commit to compare against — skipping."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # core.quotepath=false is essential, not cosmetic: by default git
          # prints any path containing non-ASCII characters octal-escaped
          # and wrapped in quotes (e.g. "resources/.../\342\232\241edit.blade.php").
          # Every Livewire single-file page here is named with a leading ⚡,
          # so without this, none of them ever matched the raw ⚡ paths that
          # `find` prints below — a patched ⚡ file that upstream also changed
          # was never seen as a collision, took the plain-copy path, and our
          # stale .fork-patches copy silently overwrote upstream's changes
          # (confirmed the hard way: it removed the agentic-writes settings
          # section and reverted a soft-delete fix in the setup wizard).
          changed_by_push="$(git -c core.quotepath=false diff --name-only "$before" "$after")"

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            dest="${f#.fork-patches/}"
            if printf '%s\n' "$changed_by_push" | grep -qxF "$dest"; then
              echo "$dest" >> /tmp/collided-files.txt
            fi
          done < <(find .fork-patches -type f)

          count=$(wc -l < /tmp/collided-files.txt)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "This push also touched $count file(s) we've patched:"
            cat /tmp/collided-files.txt
          else
            echo "No overlap between this push and our patched files."
          fi

      - name: Check whether upstream has anything we haven't merged
        id: upstream
        # Read-only. Split out of the merge so the backup below can be made BEFORE the merge
        # and only when there is one: it fetches upstream and records whether we are behind.
        run: |
          set -euo pipefail
          upstream_url="${UPSTREAM_URL:-https://github.com/${UPSTREAM_REPO}.git}"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$upstream_url"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already contains everything in $UPSTREAM_REPO@$UPSTREAM_BRANCH — nothing to sync."
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream has $(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH") commit(s) we don't."
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Back up main before merging
        id: backup
        # Only when a merge is about to happen: an upstream sync (above), or a collision, where
        # the triggering push also changed a patched file and the copy step 3-way merges it. A
        # run that merges nothing — a plain patch upload, a daily check with nothing new — makes
        # no backup. If this step fails, every step after it is skipped, so nothing is ever
        # merged without one. Named to match the *backup*/*Backup* branch-protection ruleset
        # (blocks deletion and force-push), so it is a genuinely safe snapshot of main exactly as
        # it was before anything below changes it.
        if: steps.collisions.outputs.count != '0' || steps.upstream.outputs.behind == 'true'
        run: |
          set -euo pipefail
          branch="Backup-$(date +%d.%m.%Y)"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
            # Already one for today — suffix with this run's id so a second rollback
            # point doesn't overwrite the first.
            branch="${branch}-${{ github.run_id }}"
          fi

          git branch "$branch" HEAD
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Backup branch created: $branch ($(git rev-parse --short HEAD))"

      - name: Sync with upstream, merging through any conflicts
        id: sync
        if: steps.upstream.outputs.behind == 'true'
        # See the header for why this exists. Per-file policy when upstream and we both
        # changed a file (everything outside a conflicting hunk always merges normally):
        #   - a file we patch: a true 3-way merge; a conflicting hunk that is only comments
        #     and where one side merely ADDED lines keeps both (nothing lost, not flagged);
        #     any other conflicting hunk keeps OUR side of that hunk only, and is flagged;
        #   - a file we do not patch: upstream's version, flagged;
        #   - a workflow file: ours, flagged, with the upstream diff in the run summary.
        # A merged result that fails `php -l` falls back to our whole copy, flagged.
        env:
          BACKUP_BRANCH: ${{ steps.backup.outputs.branch }}
        run: |
          set -euo pipefail

          # Upstream was fetched by the check step above; we only get here when we are behind it.
          up="upstream/$UPSTREAM_BRANCH"

          base="$(git merge-base HEAD "$up")"
          git log --format='%h %s' "HEAD..$up" > /tmp/upstream-commits.txt
          echo "Upstream has $(wc -l < /tmp/upstream-commits.txt) commit(s) we don't:"
          sed 's/^/  /' /tmp/upstream-commits.txt | head -40

          record() { printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> /tmp/sync-actions.tsv; }
          review() { printf '%s — %s\n' "$1" "$2" >> /tmp/needs-manual-review.txt; }

          # Put a path back exactly as it is on OUR side of the merge.
          restore_ours() {
            if git cat-file -e "HEAD:$1" 2>/dev/null; then git checkout HEAD -- "$1"; else git rm -f -q -- "$1"; fi
          }

          cat > /tmp/resolve_conflicts.py <<'PYEOF'
          #!/usr/bin/env python3
          """Resolve the conflict hunks in the output of `git merge-file --diff3 --marker-size=15`.

          usage: resolve_conflicts.py <merge-file-output> <repo-path> <out-dir>
            stdout        the resolved file
            <out>/how.txt a one-line, human-readable description of what was done
            <out>/flag.txt '1' if any hunk needs a human look, else '0'

          Policy, hunk by hunk (everything outside a conflicting hunk was already merged cleanly):
            * A COMMENT-ONLY hunk where one side merely ADDED lines to the common base loses nothing if
              we keep the other side's wording and re-add those lines. Resolved automatically.
            * Anything else (code, or comments both sides rewrote): our side wins that hunk only, and it
              is flagged. Keeping both sides of a code hunk can lint cleanly and still do the wrong
              thing (a duplicated statement, a repeated array key), so it is never done automatically.
          """
          import difflib
          import json
          import os
          import re
          import sys

          src, path, out_dir = sys.argv[1:4]
          MARK = 15
          OURS, BASE, SEP, THEIRS = ('<' * MARK + ' ', '|' * MARK + ' ', '=' * MARK, '>' * MARK + ' ')

          # Only for languages where a leading marker means "this line is a comment".
          COMMENT_EXTS = {'.php', '.js', '.ts', '.css', '.scss', '.yml', '.yaml', '.sh'}
          COMMENT_LINE = re.compile(r'^\s*(\*/?|/\*+|//|#|\{\{--|--\}\})')


          def commentish(lines):
              return all(l.strip() == '' or COMMENT_LINE.match(l) for l in lines)


          def pure_insertion(base, other):
              """The lines `other` ADDED to `base` — or None if it also changed or removed any base line."""
              added = []
              for tag, _i1, _i2, j1, j2 in difflib.SequenceMatcher(None, base, other, autojunk=False).get_opcodes():
                  if tag in ('replace', 'delete'):
                      return None
                  if tag == 'insert':
                      added.extend(other[j1:j2])
              return added


          def keep_new(added, already):
              # A bare ' *' / blank separator is kept even if the other side has one; real text only if new.
              return [l for l in added if l.strip() in ('', '*') or l not in already]


          def resolve(ours, base, theirs, ext):
              if ext in COMMENT_EXTS and commentish(ours + base + theirs):
                  ours_added = pure_insertion(base, ours)
                  if ours_added is not None:
                      return theirs + keep_new(ours_added, theirs), "comment hunk: kept upstream's wording and re-added our lines", False
                  theirs_added = pure_insertion(base, theirs)
                  if theirs_added is not None:
                      return ours + keep_new(theirs_added, ours), "comment hunk: kept our wording and re-added upstream's lines", False
              return ours, "overlapping edits that can't be combined safely: our side kept, upstream's side of that hunk dropped", True


          ext = os.path.splitext(path)[1].lower()
          lines = open(src, encoding='utf-8', errors='surrogateescape', newline='').read().split('\n')

          out, results, i = [], [], 0
          while i < len(lines):
              if lines[i].startswith(OURS):
                  ours, base, theirs, mode = [], [], [], 'ours'
                  i += 1
                  while i < len(lines) and not lines[i].startswith(THEIRS):
                      ln = lines[i]
                      if ln.startswith(BASE):
                          mode = 'base'
                      elif ln == SEP:
                          mode = 'theirs'
                      else:
                          {'ours': ours, 'base': base, 'theirs': theirs}[mode].append(ln)
                      i += 1
                  resolved, how, review = resolve(ours, base, theirs, ext)
                  out.extend(resolved)
                  results.append((how, review))
              else:
                  out.append(lines[i])
              i += 1

          sys.stdout.write('\n'.join(out))
          os.makedirs(out_dir, exist_ok=True)
          summary = '; '.join(sorted({h for h, _ in results})) or 'no conflicting hunks'
          n = len(results)
          open(os.path.join(out_dir, 'how.txt'), 'w').write(f"{n} conflicting hunk{'s' if n != 1 else ''} — {summary}")
          open(os.path.join(out_dir, 'flag.txt'), 'w').write('1' if any(r for _, r in results) else '0')
          PYEOF

          # ── 1. Start the merge. Conflicts here are expected and are resolved below, so a non-zero
          #       exit is only fatal if git failed for some OTHER reason (no unmerged files to fix).
          set +e
          git merge --no-commit --no-ff "$up" > /tmp/merge.log 2>&1
          merge_rc=$?
          set -e
          cat /tmp/merge.log
          if [ "$merge_rc" -ne 0 ] && [ -z "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::git merge failed without any content conflict (see the log above) — nothing was merged."
            git merge --abort 2>/dev/null || true
            exit 1
          fi

          # ── 2. Files we patch that upstream also changed. These are redone with a TRUE 3-way merge:
          #       ours = our .fork-patches copy (the source of truth for our intent), theirs = upstream's
          #       new file, base = the file at the real merge-base with upstream. git's own merge only
          #       sees "HEAD's copy", which can lag a patch that's waiting to be applied, and the copy
          #       step below has no true base to work from; this has both. The result is written to the
          #       real path AND to .fork-patches, so the copy step that follows is a no-op for these
          #       files instead of overwriting upstream's changes with a stale copy.
          resolve_patched() {
            local path="$1" status="$2" ours=".fork-patches/$1" work final how flag rc
            work="$(mktemp -d)"

            if [ "$status" = "D" ]; then
              mkdir -p "$(dirname "$path")"
              cp "$ours" "$path"
              git add -- "$path"
              record "$path" "upstream deleted this file; our patched copy was kept" 1
              review "$path" "upstream deleted this file but we patch it — our copy was kept; decide whether the patch is still wanted"
              return 0
            fi

            cp "$ours" "$work/ours"
            git show "$up:$path" > "$work/theirs"
            if git cat-file -e "$base:$path" 2>/dev/null; then git show "$base:$path" > "$work/base"; else : > "$work/base"; fi

            rc=0
            git merge-file -p --diff3 --marker-size=15 -L ours -L base -L theirs \
              "$work/ours" "$work/base" "$work/theirs" > "$work/merged" 2> "$work/err" || rc=$?

            final="$work/merged"; how="merged cleanly — upstream's change and ours both kept"; flag=0
            if [ "$rc" -ge 128 ]; then
              final="$work/ours"; how="could not be 3-way merged ($(head -1 "$work/err")); our copy was kept"; flag=1
            elif [ "$rc" -gt 0 ]; then
              # Overlapping edits. Resolve hunk by hunk — everything outside a conflicting hunk is
              # already merged, so upstream's other changes to this file are NOT lost.
              if python3 /tmp/resolve_conflicts.py "$work/merged" "$path" "$work/rep" > "$work/resolved"; then
                final="$work/resolved"; how="$(cat "$work/rep/how.txt")"; flag="$(cat "$work/rep/flag.txt")"
              else
                final="$work/ours"; how="the conflict resolver failed; our copy was kept"; flag=1
              fi
            fi

            # Belt and braces: never commit a file that still has conflict markers or won't parse.
            if grep -qE '^(<{15} |={15}$|>{15} |\|{15} )' "$final"; then
              final="$work/ours"; how="conflict markers survived resolution; our copy was kept"; flag=1
            fi
            case "$path" in
              *.php)
                if command -v php > /dev/null 2>&1 && ! php -l "$final" > /dev/null 2>&1; then
                  final="$work/ours"; how="the merged file failed php -l; our copy was kept"; flag=1
                fi
                ;;
            esac

            mkdir -p "$(dirname "$path")"
            cp "$final" "$path"
            cp "$final" "$ours"
            git add -- "$path" "$ours"
            record "$path" "$how" "$flag"
            if [ "$flag" = "1" ]; then review "$path" "$how"; fi
          }

          git -c core.quotepath=false diff --name-status --no-renames "$base" "$up" > /tmp/upstream-changes.txt
          while IFS=$'\t' read -r status path; do
            [ -n "$path" ] && [ -f ".fork-patches/$path" ] || continue
            resolve_patched "$path" "$status"
          done < /tmp/upstream-changes.txt

          # ── 3. Anything still conflicted is NOT one of our patches. By this fork's own rule every
          #       intentional customization lives in .fork-patches, so upstream's version is the
          #       right default — but it is flagged, since a direct edit may have been lost (the
          #       backup branch still has it).
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in .github/workflows/*) continue ;; esac
            if git cat-file -e "$up:$path" 2>/dev/null; then git checkout "$up" -- "$path"; else git rm -f -q -- "$path"; fi
            record "$path" "conflicted and is not one of our patches — upstream's version was taken" 1
            review "$path" "conflicted and is not tracked in .fork-patches, so upstream's version was taken — check no direct edit we meant to keep was lost (the backup branch has the old file)"
          done < <(git -c core.quotepath=false diff --name-only --diff-filter=U)

          # ── 4. Workflow files. The Actions token is not allowed to push changes to
          #       .github/workflows/, so a merge that carried any would be rejected outright and the
          #       whole sync would fail every night. Keep our copies, and say exactly what upstream
          #       changed so it can be applied by hand.
          : > /tmp/upstream-workflow-diff.txt
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            git diff "HEAD" "$up" -- "$path" >> /tmp/upstream-workflow-diff.txt || true
            restore_ours "$path"
            record "$path" "upstream changed this workflow; our copy was kept (the Actions token cannot push workflow changes)" 1
            review "$path" "upstream changed this workflow file; the bot cannot push workflow changes — apply it by hand (the run summary shows the diff)"
          done < <(git -c core.quotepath=false diff --name-only HEAD -- .github/workflows)

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Some files are still unresolved after the sync step:"
            git diff --name-only --diff-filter=U
            git merge --abort 2>/dev/null || true
            exit 1
          fi

          # ── 5. Commit the merge. It is pushed by the commit step below, together with the
          #       patch reapply, so the whole run lands atomically or not at all.
          body="$(sed 's/^/Upstream: /' /tmp/upstream-commits.txt)"
          if [ -s /tmp/sync-actions.tsv ]; then
            body="$body"$'\n\n'"Resolutions:"$'\n'"$(awk -F'\t' '{printf "- %s: %s\n", $1, $2}' /tmp/sync-actions.tsv)"
          fi
          git commit -q -m "Merge $UPSTREAM_REPO@$UPSTREAM_BRANCH into main (automatic sync)" -m "$body"
          echo "merged=true" >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream sync"
            echo
            echo "Merged **$(wc -l < /tmp/upstream-commits.txt)** upstream commit(s) from \`$UPSTREAM_REPO@$UPSTREAM_BRANCH\`. A backup of main from before the merge: \`$BACKUP_BRANCH\`."
            echo
            sed 's/^/- /' /tmp/upstream-commits.txt
            if [ -s /tmp/sync-actions.tsv ]; then
              echo
              echo "### Files that needed a decision"
              echo
              echo "| File | What happened | Needs a look |"
              echo "|---|---|---|"
              awk -F'\t' '{printf "| `%s` | %s | %s |\n", $1, $2, ($3 == "1" ? "yes" : "no") }' /tmp/sync-actions.tsv
            fi
            if [ -s /tmp/upstream-workflow-diff.txt ]; then
              echo
              echo "### Upstream workflow changes to apply by hand"
              echo
              echo '```diff'
              cat /tmp/upstream-workflow-diff.txt
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"


      - name: Copy patch files over their real paths, merging where this push also changed one
        run: |
          set -euo pipefail
          if [ ! -d .fork-patches ]; then
            echo "No .fork-patches directory found — nothing to reapply."
            exit 0
          fi

          find .fork-patches -type f | while read -r src; do
            dest="${src#.fork-patches/}"
            mkdir -p "$(dirname "$dest")"

            if ! grep -qxF "$dest" /tmp/collided-files.txt 2>/dev/null; then
              # The common case: nothing about this file changed on the
              # upstream/incoming side of this push, so our copy is simply
              # correct as-is.
              cp "$src" "$dest"
              echo "Reapplied: $dest"
              continue
            fi

            echo "Attempting 3-way merge for $dest (this push also changed it)..."

            # Base = what the real file looked like at the exact commit
            # where we last updated OUR .fork-patches copy — main's history
            # here is fast-forward-only (never rebased/force-pushed), so
            # that commit is always a direct ancestor of HEAD, and at the
            # moment it was made the real path hadn't been touched yet (our
            # own commits only ever change .fork-patches directly; reapply
            # handles the real path separately, afterwards). That makes it
            # exactly "upstream's content right before we most recently
            # customized this file" — the correct base for a 3-way merge
            # against "upstream's content now" (theirs) and "our current
            # customization" (ours).
            last_patch_commit="$(git log -1 --format=%H -- "$src" 2>/dev/null || true)"

            if [ -z "$last_patch_commit" ] \
              || ! git show "$last_patch_commit:$dest" > /tmp/merge-base.txt 2>/dev/null \
              || ! git show "HEAD:$dest" > /tmp/merge-theirs.txt 2>/dev/null; then
              # No prior patch commit to anchor a base on, the file didn't
              # exist yet at that point, or it's been deleted by the
              # incoming change — nothing meaningful to 3-way merge
              # against. Safe fallback: keep our version, flag for a human
              # to look at rather than guess.
              cp "$src" "$dest"
              echo "$dest" >> /tmp/needs-manual-review.txt
              echo "  No usable merge base for $dest — kept our version, flagged for review."
              continue
            fi

            cp "$src" /tmp/merge-ours.txt

            if git merge-file -p /tmp/merge-ours.txt /tmp/merge-base.txt /tmp/merge-theirs.txt > /tmp/merge-result.txt 2>/tmp/merge-stderr.txt; then
              # Clean merge — our change and the incoming one touched
              # different parts of the file. Adopt the combined result as
              # both the real file and the new .fork-patches copy, so
              # future runs reapply the merged version, not the pre-merge
              # one — otherwise the next sync would just re-collide with
              # the same already-resolved change.
              cp /tmp/merge-result.txt "$dest"
              cp /tmp/merge-result.txt "$src"
              echo "  Merged cleanly — upstream's change and ours both kept, .fork-patches updated to match."
            else
              # Genuine textual overlap git can't reconcile on its own.
              # Safe fallback: our version wins outright (identical to
              # this workflow's behaviour before merging existed), and
              # this file is called out for manual review below rather
              # than silently discarding whichever side lost.
              cp "$src" "$dest"
              echo "$dest" >> /tmp/needs-manual-review.txt
              echo "  Real conflict — kept our version, flagged for review."
            fi
          done

      - name: Commit and push if anything changed
        id: commit_and_push
        # Retries on a rejected push: this workflow's own concurrency guard only serializes
        # overlapping runs of ITSELF — it can't stop a direct human commit landing on main
        # in the narrow window between this job's checkout and its own push. That is a
        # normal, expected "fetch first" rejection, not a real conflict. Rebase onto
        # whatever's new and try again, a few times, before giving up. --rebase-merges
        # matters now: a plain rebase would flatten the upstream merge commit this run may
        # have made into re-applied copies of upstream's commits.
        env:
          SYNC_MERGED: ${{ steps.sync.outputs.merged }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `git diff --quiet` (no args) only compares already-tracked files — it is blind
          # to a brand-new file the copy step just placed at a path never committed before.
          # Staging everything first and diffing the INDEX against HEAD catches both
          # modifications and additions. (A real, confirmed bug: every genuinely new file
          # introduced via .fork-patches silently never got committed here.)
          git add -A
          committed=false
          if ! git diff --cached --quiet; then
            if [ -s /tmp/needs-manual-review.txt ]; then
              commit_msg="Reapply fork patches after upstream sync (some files need manual review)"
            else
              commit_msg="Reapply fork patches after upstream sync"
            fi
            git commit -m "$commit_msg"
            committed=true
          fi

          # The upstream merge is already a commit by now (made in the sync step), so
          # "nothing staged" no longer means "nothing to push".
          if [ "$committed" = "false" ] && [ "${SYNC_MERGED:-false}" != "true" ]; then
            echo "No changes — sync didn't touch any patched file, or patches already applied."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if push_out="$(git push origin main 2>&1)"; then
              echo "$push_out"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$push_out"

            # Not a race — retrying can never fix this, so say what it is and stop. The Actions
            # token is not allowed to push a change to .github/workflows/; the sync step keeps
            # our copies of those files to avoid it, but if GitHub still objects the only fix is
            # a personal access token with the `workflow` scope (or syncing by hand).
            if printf '%s' "$push_out" | grep -qiE 'workflows?[` ]*(permission|scope)|refusing to allow .*workflow'; then
              echo "::error::GitHub refused the push because it touches a workflow file, which the Actions token may not change. Nothing was pushed — main is unchanged (the backup branch is untouched too). Either apply upstream's workflow changes by hand and re-run, or add a personal access token with the workflow scope."
              exit 1
            fi

            echo "Push rejected (attempt ${attempt}/5) — something else pushed to main first. Rebasing and retrying..."
            git fetch origin main
            if ! git rebase --rebase-merges origin/main; then
              git rebase --abort || true
              echo "::error::The rebase onto the new main hit a genuine conflict. Nothing was pushed — main is unchanged. Re-run this workflow once main has settled."
              exit 1
            fi
            sleep 2
          done

          echo "::error::Failed to push after 5 attempts — main is moving too fast for this job to keep up. Re-run this workflow."
          exit 1

      - name: Trigger the docker build for this commit
        # GitHub does not fire other workflows' `on: push` for a commit
        # pushed using the default GITHUB_TOKEN (a deliberate anti-loop
        # safeguard) — meaning docker.yml silently never built any of this
        # workflow's own commits. That's a real, confirmed gap: every fix
        # that only reached main via this bot's commit (rather than a
        # direct human push) never got its own image build, and :edge
        # stayed on whatever a later, unrelated human commit happened to
        # build next. A workflow_dispatch triggered via the API isn't
        # subject to that restriction, so trigger it explicitly here.
        if: steps.commit_and_push.outputs.pushed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/docker.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Trigger the test run for this commit
        # Same reason as the docker trigger above: the bot's commit is exactly the
        # tree that ships (patched files copied over their real paths), yet a
        # GITHUB_TOKEN push never starts the `tests` workflow, so it was never
        # tested. A dispatch is not subject to that restriction. Deliberately no
        # continue-on-error: if this cannot dispatch, the run should go red rather
        # than quietly bring the gap back.
        if: steps.commit_and_push.outputs.pushed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/tests.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Fail loudly if any file needed manual review
        # Runs after the commit/push/trigger above already went through — the app is
        # deployed and working either way (a file that could not be merged cleanly kept
        # one side, never a broken mix). This step's only job is to make the run show red
        # so a failure notification fires; a plain ::warning:: annotation does not trigger
        # GitHub's failure-notification email, only a genuinely failed run does.
        env:
          BACKUP_BRANCH: ${{ steps.backup.outputs.branch }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/needs-manual-review.txt ]; then
            echo "Nothing needed manual review."
            exit 0
          fi

          echo "::error::These files need a human look. The run itself went through and the app is fine, but a decision was made for each file below that may have dropped something real — see the run summary for the detail. A backup of main from right before this run is the branch ${BACKUP_BRANCH}, if anything needs rolling back:"
          sed 's/^/::error::  - /' /tmp/needs-manual-review.txt
          exit 1
